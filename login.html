<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | MantaFlow</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      background: #000;
    }
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      z-index: -2;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: -1;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class="flex items-center justify-center text-white">

  <!-- Background Video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="images/bg.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Login Card -->
  <div class="glass p-10 rounded-3xl shadow-2xl w-[90%] max-w-md">

    <h1 class="text-4xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-300 to-blue-400 bg-clip-text text-transparent">
      Admin Login
    </h1>

    <p class="text-center text-blue-100 mb-8">
      Welcome back to MantaFlow Portal
    </p>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-6">

      <input
        type="text"
        name="username"
        placeholder="Username or Email"
        required
        class="w-full px-5 py-4 rounded-xl bg-white/20 border border-white/30 text-white placeholder-gray-300 focus:ring-4 focus:ring-cyan-400 transition"
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
        class="w-full px-5 py-4 rounded-xl bg-white/20 border border-white/30 text-white placeholder-gray-300 focus:ring-4 focus:ring-cyan-400 transition"
      />

      <button
        type="submit"
        class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl font-bold text-lg hover:from-cyan-600 hover:to-blue-700 transform hover:scale-105 transition shadow-lg"
      >
        Login
      </button>

    </form>

    <!-- MESSAGE -->
    <div id="message" class="mt-6 text-center font-medium min-h-[28px]"></div>

    <p class="mt-8 text-center text-sm text-blue-200">
      Don’t have an account?
      <a href="signup.html" class="font-bold text-white hover:text-cyan-300">
        Sign up
      </a>
    </p>

  </div>

  <!-- LOGIN SCRIPT -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const msg = document.getElementById("message");
      const btn = this.querySelector("button");

      msg.innerHTML = "";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const formData = new FormData(this);

      try {
        const res = await fetch("backend/login.php", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.status === "success") {
          msg.innerHTML = "<span class='text-green-400'>Login successful! Redirecting...</span>";

          setTimeout(() => {
            window.location.href = "admin.php"; // dashboard page
          }, 1000);

        } else {
          msg.innerHTML = `<span class='text-red-400'>${data.message}</span>`;
        }

      } catch (error) {
        msg.innerHTML = "<span class='text-red-400'>Server error. Try again.</span>";
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
